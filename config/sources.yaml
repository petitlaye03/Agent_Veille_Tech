# Socle de sources de l'agent de veille.
#
# Ajouter ou retirer une source d'un type déjà implémenté ne demande AUCUNE
# modification de code — seulement une entrée ici (AD-3).
#
# Types disponibles : rss | json | scrape
# Registres         : apprendre | ce_qui_bouge | pour_le_metier
#
# priorite (optionnel, défaut 0) — départage le dédoublonnage : quand deux
# sources relaient le même article, celle de plus haute priorité l'emporte.
# Échelle en vigueur :
#   10  source primaire — l'éditeur publie sa propre actualité
#    5  curation — sélectionne et met en avant du contenu tiers
#    0  agrégateur — relaie l'actualité d'autrui (défaut)
# Le but : à annonce identique, garder la source d'origine plutôt que
# celui qui la reprend.

sources:
  # --- Flux RSS/Atom -------------------------------------------------------
  - id: openai-news
    priorite: 10
    type: rss
    url: https://openai.com/news/rss.xml
    langue: en
    registre: ce_qui_bouge

  - id: huggingface-blog
    priorite: 10
    type: rss
    url: https://huggingface.co/blog/feed.xml
    langue: en
    registre: apprendre

  # --- API JSON ------------------------------------------------------------
  # Le mapping décrit la forme de l'API : brancher une autre API JSON
  # (Kaggle, etc.) se fait ici, sans écrire de connecteur supplémentaire.
  - id: hf-daily-papers
    priorite: 5
    type: json
    url: https://huggingface.co/api/daily_papers?limit=50
    langue: en
    registre: apprendre
    # Médiane mesurée à 3 votes le jour du relevé (addendum du brief) ; 15
    # retenait 4 papiers sur 26 — la cible « 3-5 marquants » du PRD. Seuil
    # fixe volontairement simple pour cette story (Story 1.4 Dev Notes) ;
    # un seuil dynamique (max(10, p80 du jour)) reste une évolution documentée.
    seuil_signal: 15
    mapping:
      guid: paper.id
      titre: title
      date_publication: publishedAt
      contenu_brut: paper.summary
      signal: paper.upvotes
    url_modele: https://huggingface.co/papers/{guid}

  # --- Scraping ------------------------------------------------------------
  # Anthropic n'expose aucun flux officiel. robots.txt vérifié le 2026-07-28 :
  # « User-Agent: * / Allow: / » — collecte autorisée (AD-10).
  - id: anthropic-news
    priorite: 10
    type: scrape
    url: https://www.anthropic.com/news
    langue: en
    registre: ce_qui_bouge
    selecteur: /news/
    base_url: https://www.anthropic.com
