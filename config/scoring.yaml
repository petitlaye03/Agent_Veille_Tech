# Pondérations du scoring par profil (AD-3, Story 1.4).
#
# Modifier une valeur ici change le classement sans toucher au code. Un
# fichier absent ou illisible retombe sur les mêmes valeurs par défaut
# (voir `Ponderations` dans src/veille/filter.py).
#
# seuil_bruit : score en dessous duquel un item est écarté du digest,
# pas seulement rétrogradé.
#
# marge_recommandation (Story 1.7) : écart minimal entre le meilleur score
# du jour et le second pour que l'entrée soit recommandée. Aucune
# recommandation n'est forcée si aucun item ne dépasse le second d'au
# moins cette marge.

ponderations:
  prioritaire: 10
  signal_fort: 15
  domaine: 5
  secondaire: 2
  bruit: -20

seuil_bruit: -5
marge_recommandation: 10
